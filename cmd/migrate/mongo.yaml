version: "0.1"

mongodb:
  schema: "./internal/platform/database/mongodb/migrations/schema"
  gen:
    out: "./internal/platform/database/mongodb/migrations/generated"
    package: "generated"
  migrations:
    dir: "./internal/platform/database/mongodb/migrations/versions"
  seeding:
    dir: "./cmd/migrate/seeds"
    files:
      - collection: "users"
        file: "users.json"
      - collection: "todos"
        file: "todos.json"
