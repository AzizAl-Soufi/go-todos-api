version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/database/postgres/sqlc/queries.sql"
    schema: "./internal/database/postgres/migrations"
    gen:
      go:
        package: "sqlc"
        out: "./internal/database/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
