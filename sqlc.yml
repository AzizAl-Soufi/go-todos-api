version: "2"

# Each module owns its queries and generated code; the schema (migrations) is
# shared. Regenerate with `make sqlc`.
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
          pointer: true
      - db_type: "timestamptz"
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true

sql:
  - engine: "postgresql"
    schema: "./internal/platform/database/postgres/migrations"
    queries: "./internal/modules/todos/adapters/persistence/pgstore/queries.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "./internal/modules/todos/adapters/persistence/pgstore/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true

  - engine: "postgresql"
    schema: "./internal/platform/database/postgres/migrations"
    queries: "./internal/modules/identity/adapters/persistence/pgstore/queries.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "./internal/modules/identity/adapters/persistence/pgstore/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true
