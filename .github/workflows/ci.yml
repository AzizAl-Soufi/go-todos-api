name: ci

on:
  pull_request:
    branches: [main]
  # Lets cd.yml run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Single source of truth: the toolchain directive in go.mod.
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Builds golangci-lint with the go.mod toolchain (version pinned in the
      # Makefile) and runs it with .golangci.yml.
      - name: Run golangci-lint
        run: make lint

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Starts PostgreSQL and a single-node MongoDB replica set from
      # docker-compose.test.yml, runs every test against them (store contracts,
      # transactions, migrations), then the end-to-end suite on each database.
      - name: Test against PostgreSQL and MongoDB
        run: make test-integration

      - name: Database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # govulncheck also reports standard-library vulnerabilities for the
          # Go version it runs with, so use the same go.mod toolchain.
          go-version-file: go.mod

      # Fails only on vulnerabilities reachable from this module's code.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker Build
    # On PRs only: make sure the image still builds. cd.yml builds and pushes after merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
